# App Configuration (YAML-like format)
# Format:
# - name: App Name
#   repo: https://github.com/user/repo
#   binary: binary_name
#   icon: path/to/icon.svg
#   comment: Description (optional)
#   categories: Category1;Category2; (optional)
#   startup_wm_class: WMClass (optional)
#   mime_type: mime/type; (optional)

- name: Audacity
  repo: https://github.com/audacity/audacity
  binary: audacity
  icon: icons/audacity.svg
  comment: Audio Editor
  categories: AudioVideo;Audio;
  startup_wm_class: Audacity
  mime_type: application/x-audacity-project;application/x-audacity-project+sqlite3;

